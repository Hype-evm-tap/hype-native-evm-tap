name = "hype-tap-app"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "hype-tap-db"
database_id = "5210a709-0c6c-4d69-8954-2c88e0a1b647"

[vars]
ADMIN_ID = "8990854464"
BOT_USERNAME = "Hype_nativeevm_bot"
MIN_WITHDRAW = "2"
TAP_REWARD = "0.0000000695"
REFERRAL_REWARD = "0.00008526"
ENERGY_MAX = "1000"
ENERGY_COOLDOWN_SEC = "3600"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
run_worker_first = true
