<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hype Token | Tap to Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #020a06;
        color: #e0ffe8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
      }
      #root { min-height: 100vh; }

      /* Pure green boot splash (no yellow) */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 30%, rgba(0, 100, 50, 0.4) 0%, transparent 55%),
          radial-gradient(ellipse at 50% 80%, rgba(0, 40, 20, 0.3) 0%, transparent 45%),
          #020a06;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #boot-splash.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-splash .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px;
      }
      #boot-splash .boot-logo-wrap {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-splash .boot-logo {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 40px rgba(0, 255, 136, 0.45), 0 0 80px rgba(0, 255, 136, 0.2);
        animation: bootPulse 1.8s ease-in-out infinite;
        z-index: 2;
      }
      #boot-splash .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #00ff88;
        border-right-color: rgba(0, 255, 136, 0.4);
        animation: bootSpin 1.1s linear infinite;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.25);
      }
      #boot-splash .boot-title {
        margin-top: 8px;
        font-size: 1.45rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #00ff88;
        text-shadow: 0 0 18px rgba(0, 255, 136, 0.5);
      }
      #boot-splash .boot-sub {
        font-size: 0.85rem;
        color: rgba(160, 255, 192, 0.75);
      }
      #boot-splash .boot-bar {
        margin-top: 10px;
        width: 160px;
        height: 4px;
        border-radius: 4px;
        background: rgba(0, 255, 136, 0.12);
        overflow: hidden;
      }
      #boot-splash .boot-bar-fill {
        height: 100%;
        width: 40%;
        border-radius: 4px;
        background: linear-gradient(90deg, transparent, #00ff88, transparent);
        animation: bootBar 1.4s ease-in-out infinite;
      }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.92; }
      }
      @keyframes bootBar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="boot-inner">
        <div class="boot-logo-wrap">
          <img src="/hype-logo.png" alt="HYPE" class="boot-logo" />
          <div class="boot-ring"></div>
        </div>
        <div class="boot-title">Hype Token</div>
        <div class="boot-sub">Tap to Earn · Loading…</div>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
