name: Validate pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Report frontend dependency advisories
        working-directory: frontend
        run: npm audit --json > ../frontend-npm-audit.json || true

      - name: Install Worker dependencies
        run: npm install

      - name: Report Worker dependency advisories
        run: npm audit --json > worker-npm-audit.json || true

      - name: Validate Worker bundle (dry run)
        run: npx wrangler deploy --dry-run
