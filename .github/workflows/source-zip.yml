name: Package HYPE app source ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source ZIP
        run: zip -r hype-native-evm-tap-latest.zip . -x ".git/*" "node_modules/*" "frontend/node_modules/*" "frontend/dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: hype-native-evm-tap-latest
          path: hype-native-evm-tap-latest.zip
          retention-days: 7
